<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustPass — Revente sécurisée de billets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Système typo TrustPass : Righteous (titres display, énergie événementielle) + Poppins (corps). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Righteous&display=swap"
      rel="stylesheet"
    />
    <!-- Splash screen : « moment de marque » encre + égaliseur violet, avant même le
         chargement du bundle React. Autonome (aucune dépendance Tailwind/JS). -->
    <style id="splash-style">
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1.4rem, 1rem + 2vw, 2.4rem);
        background: #0a0a0a; /* carbon — encre de la marque */
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* Groupe logo : entrée « zoom avec rebond » (variante recommandée). */
      .splash-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
        animation: splash-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes splash-pop {
        0% { opacity: 0; transform: scale(0.3); }
        60% { opacity: 1; transform: scale(1.08); }
        100% { transform: scale(1); }
      }
      /* Égaliseur : 5 barres violettes qui pulsent (le logo « vit »). */
      .splash-eq {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: clamp(56px, 14vw, 84px);
      }
      .splash-eq span {
        width: clamp(7px, 1.6vw, 10px);
        height: 30%;
        border-radius: 999px;
        background: #7c3aed; /* accent violet */
        transform-origin: bottom;
        animation: splash-eq 1.1s ease-in-out infinite;
      }
      .splash-eq span:nth-child(1) { animation-delay: 0s;    height: 40%; }
      .splash-eq span:nth-child(2) { animation-delay: 0.15s; height: 70%; }
      .splash-eq span:nth-child(3) { animation-delay: 0.3s;  height: 100%; }
      .splash-eq span:nth-child(4) { animation-delay: 0.12s; height: 60%; }
      .splash-eq span:nth-child(5) { animation-delay: 0.24s; height: 45%; }
      @keyframes splash-eq {
        0%, 100% { transform: scaleY(0.35); }
        50% { transform: scaleY(1); }
      }
      /* Mot-clé de marque. */
      .splash-word {
        font-family: "Righteous", system-ui, sans-serif;
        font-size: clamp(1.8rem, 1.2rem + 3vw, 2.8rem);
        letter-spacing: -0.01em;
        color: #ffffff;
        animation: splash-rise 0.6s ease-out 0.35s both;
      }
      .splash-word b { color: #a78bfa; font-weight: inherit; } /* point violet clair */
      @keyframes splash-rise {
        0% { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      /* Loader : barre indéterminée sous le logo. */
      .splash-loader {
        width: clamp(120px, 30vw, 190px);
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .splash-loader::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #7c3aed;
        animation: splash-slide 1.2s ease-in-out infinite;
      }
      @keyframes splash-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(320%); }
      }
      /* Accessibilité : pas de mouvement si l'utilisateur le demande. */
      @media (prefers-reduced-motion: reduce) {
        .splash-logo,
        .splash-word { animation: none; opacity: 1; transform: none; }
        .splash-eq span { animation: none; }
        .splash-loader::after { animation-duration: 0.01ms; }
      }
    </style>
  </head>
  <body>
    <!-- Splash : premier peint, recouvre #root le temps que React monte. -->
    <div id="splash" role="status" aria-label="Chargement de TrustPass">
      <div class="splash-logo">
        <div class="splash-eq" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="splash-word">Trust<b>Pass</b></div>
      </div>
      <div class="splash-loader" aria-hidden="true"></div>
    </div>
    <script>
      // Horodatage du premier peint : garantit une durée d'affichage minimale
      // même si le bundle est déjà en cache (sinon le splash « clignote »).
      window.__splashStart = Date.now();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
