name: CI

# Intégration continue TrustPass (C2.1.2) : lint + typecheck + tests au push et sur PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- API backend : qualité + tests unitaires -----------------------------
  backend:
    name: Backend (lint · typecheck · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valeurs factices : les tests unitaires n'ouvrent aucune connexion réelle,
      # mais la validation d'environnement (zod) exige des variables valides.
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trustpass?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-ci-secret-1234567890
      JWT_REFRESH_SECRET: ci-refresh-ci-refresh-1234567890
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Tests unitaires (vitest)
        run: npm test

  # --- Front React : qualité (dont a11y) + tests + build -------------------
  frontend:
    name: Frontend (lint a11y · typecheck · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint + audit accessibilité (ESLint + jsx-a11y)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Tests unitaires (vitest)
        run: npm test
      - name: Build de production
        run: npm run build
      - name: Publier le build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # --- Audit qualité/perf/accessibilité automatisé (C2.1.1) ----------------
  # Lighthouse CI sur le build statique. Avis informatif (n'échoue pas le pipeline).
  lighthouse:
    name: Lighthouse (perf · accessibilité)
    runs-on: ubuntu-latest
    needs: frontend
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
