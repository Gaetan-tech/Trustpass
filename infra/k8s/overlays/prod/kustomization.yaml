apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod
resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: trustpass-config
    patch: |-
      - op: replace
        path: /data/CORS_ORIGIN
        value: "http://prod.trustpass.local"
  - target:
      kind: Ingress
      name: trustpass
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "prod.trustpass.local"
  # Prod : 2 réplicas pour backend et frontend (haute dispo relative).
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
