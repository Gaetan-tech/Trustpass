# Ingress (ingress-nginx) : expose le frontend ; le host est fixé par l'overlay.
# Nécessite un contrôleur ingress-nginx installé une fois sur le cluster
# (voir docs/DEPLOYMENT.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trustpass
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: trustpass.local # remplacé par l'overlay d'environnement
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
