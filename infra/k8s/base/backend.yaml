# API TrustPass. initContainer : synchronise le schéma Prisma sur la base de l'env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: db-migrate
          image: trustpass-backend # remplacé par l'overlay (ACR + tag)
          command: ["npx", "prisma", "db", "push", "--skip-generate", "--accept-data-loss"]
          workingDir: /app
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trustpass-secrets
                  key: DATABASE_URL
      containers:
        - name: backend
          image: trustpass-backend # remplacé par l'overlay (ACR + tag)
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: trustpass-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trustpass-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trustpass-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: trustpass-secrets
                  key: JWT_REFRESH_SECRET
          # Séparation liveness/readiness (BLOC 4, §3.2.4) :
          # /live ne dépend que du processus ; /ready interroge les dépendances.
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: 3000
            initialDelaySeconds: 15   # laisse le temps au démarrage (validation Zod, Prisma)
            periodSeconds: 10
            failureThreshold: 3       # ~30 s avant redémarrage
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 3000
            periodSeconds: 5
            failureThreshold: 2       # retrait rapide du trafic
            successThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
